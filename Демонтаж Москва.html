<style>
:root {
  --bg-dark: #0a0a0a;
  --bg-gray: #1a1a1a;
  --accent-yellow: #FFD60A;
  --accent-orange: #FF6B1A;
  --text-white: #ffffff;
  --text-gray: #9ca3af;
  --border-gray: #2a2a2a;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-dark);
  color: var(--text-white);
  line-height: 1.6;
  overflow-x: hidden;
}

h1, h2, h3, h4, h5, h6 {
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  line-height: 1.2;
}

.container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 24px;
}

/* Header */
header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  background: rgba(10, 10, 10, 0.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border-gray);
  z-index: 1000;
  transition: all 0.3s ease;
}

header.scrolled {
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
}

.header-content {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 0;
  gap: 32px;
}

.logo {
  font-family: 'Montserrat', sans-serif;
  font-size: 24px;
  font-weight: 900;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, var(--accent-yellow), var(--accent-orange));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-decoration: none;
}

nav {
  display: flex;
  gap: 32px;
  align-items: center;
}

nav a {
  color: var(--text-gray);
  text-decoration: none;
  font-size: 15px;
  font-weight: 500;
  transition: color 0.2s;
}

nav a:hover {
  color: var(--text-white);
}

.phone {
  font-family: 'Montserrat', sans-serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--text-white);
  text-decoration: none;
  white-space: nowrap;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 14px 28px;
  border-radius: 8px;
  font-family: 'Montserrat', sans-serif;
  font-size: 15px;
  font-weight: 600;
  text-decoration: none;
  border: none;
  cursor: pointer;
  transition: all 0.3s ease;
  white-space: nowrap;
}

.btn-primary {
  background: linear-gradient(135deg, var(--accent-yellow), var(--accent-orange));
  color: var(--bg-dark);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(255, 214, 10, 0.3);
}

.btn-secondary {
  background: transparent;
  border: 2px solid var(--accent-yellow);
  color: var(--accent-yellow);
}

.btn-secondary:hover {
  background: var(--accent-yellow);
  color: var(--bg-dark);
}

/* Hero Section */
.hero {
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: center;
  padding-top: 80px;
  overflow: hidden;
}

.hero::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: 
    linear-gradient(135deg, rgba(255, 214, 10, 0.05) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(255, 107, 26, 0.08) 0%, transparent 50%);
  pointer-events: none;
}

.hero-content {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 64px;
  align-items: center;
  padding: 80px 0;
}

.hero-text h1 {
  font-size: 64px;
  font-weight: 900;
  margin-bottom: 24px;
  line-height: 1.1;
  letter-spacing: -1px;
}

.hero-text h1 .highlight {
  background: linear-gradient(135deg, var(--accent-yellow), var(--accent-orange));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hero-text p {
  font-size: 20px;
  color: var(--text-gray);
  margin-bottom: 32px;
  line-height: 1.6;
}

.hero-features {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
  margin-top: 48px;
}

.feature-badge {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 16px;
  background: var(--bg-gray);
  border: 1px solid var(--border-gray);
  border-radius: 12px;
  transition: all 0.3s ease;
}

.feature-badge:hover {
  border-color: var(--accent-yellow);
  transform: translateY(-4px);
}

.feature-badge-icon {
  font-size: 24px;
  color: var(--accent-yellow);
}

.feature-badge-title {
  font-family: 'Montserrat', sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-white);
}

.feature-badge-text {
  font-size: 13px;
  color: var(--text-gray);
}

/* Calculator Card */
.calculator-card {
  background: var(--bg-gray);
  border: 1px solid var(--border-gray);
  border-radius: 16px;
  padding: 32px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
}

.calculator-card h3 {
  font-size: 24px;
  margin-bottom: 8px;
}

.calculator-card .subtitle {
  font-size: 14px;
  color: var(--text-gray);
  margin-bottom: 24px;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-gray);
  margin-bottom: 8px;
}

.form-group input,
.form-group select {
  width: 100%;
  padding: 14px 16px;
  background: var(--bg-dark);
  border: 1px solid var(--border-gray);
  border-radius: 8px;
  color: var(--text-white);
  font-size: 15px;
  transition: border-color 0.2s;
}

.form-group input:focus,
.form-group select:focus {
  outline: none;
  border-color: var(--accent-yellow);
}

.form-group input::placeholder {
  color: #555;
}

.price-display {
  background: linear-gradient(135deg, rgba(255, 214, 10, 0.1), rgba(255, 107, 26, 0.1));
  border: 1px solid var(--accent-yellow);
  border-radius: 12px;
  padding: 24px;
  margin: 24px 0;
  text-align: center;
}

.price-label {
  font-size: 14px;
  color: var(--text-gray);
  margin-bottom: 8px;
}

.price-amount {
  font-family: 'Montserrat', sans-serif;
  font-size: 36px;
  font-weight: 900;
  background: linear-gradient(135deg, var(--accent-yellow), var(--accent-orange));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* Section Styles */
section {
  padding: 100px 0;
  position: relative;
}

.section-header {
  text-align: center;
  margin-bottom: 64px;
}

.section-header h2 {
  font-size: 48px;
  font-weight: 900;
  margin-bottom: 16px;
  letter-spacing: -0.5px;
}

.section-header p {
  font-size: 18px;
  color: var(--text-gray);
  max-width: 600px;
  margin: 0 auto;
}

/* Services Grid */
.services-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 24px;
}

.service-card {
  background: var(--bg-gray);
  border: 1px solid var(--border-gray);
  border-radius: 16px;
  padding: 32px;
  transition: all 0.3s ease;
  cursor: pointer;
}

.service-card:hover {
  border-color: var(--accent-yellow);
  transform: translateY(-8px);
  box-shadow: 0 16px 48px rgba(255, 214, 10, 0.15);
}

.service-icon {
  width: 64px;
  height: 64px;
  background: linear-gradient(135deg, var(--accent-yellow), var(--accent-orange));
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  margin-bottom: 20px;
}

.service-card h3 {
  font-size: 22px;
  margin-bottom: 12px;
}

.service-card p {
  color: var(--text-gray);
  font-size: 15px;
  line-height: 1.6;
  margin-bottom: 16px;
}

.service-price {
  font-family: 'Montserrat', sans-serif;
  font-size: 16px;
  font-weight: 700;
  color: var(--accent-yellow);
}

/* Steps Timeline */
.steps-timeline {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 32px;
  position: relative;
}

.steps-timeline::before {
  content: '';
  position: absolute;
  top: 40px;
  left: 10%;
  right: 10%;
  height: 2px;
  background: linear-gradient(to right, var(--accent-yellow), var(--accent-orange));
  z-index: 0;
}

.step {
  position: relative;
  z-index: 1;
  text-align: center;
}

.step-number {
  width: 80px;
  height: 80px;
  background: var(--bg-gray);
  border: 3px solid var(--accent-yellow);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Montserrat', sans-serif;
  font-size: 32px;
  font-weight: 900;
  color: var(--accent-yellow);
  margin: 0 auto 20px;
}

.step h3 {
  font-size: 18px;
  margin-bottom: 8px;
}

.step p {
  font-size: 14px;
  color: var(--text-gray);
}

/* Portfolio Grid */
.portfolio-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}

.portfolio-card {
  position: relative;
  aspect-ratio: 4/3;
  background: var(--bg-gray);
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.3s ease;
}

.portfolio-card:hover {
  transform: scale(1.05);
}

.portfolio-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
  color: #333;
  position: relative;
  overflow: hidden;
}

.portfolio-placeholder::before {
  content: '';
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  opacity: 0.8;
  filter: grayscale(20%);
}

.portfolio-placeholder.demolition-1::before {
  background: 
    linear-gradient(135deg, rgba(26, 26, 26, 0.3), rgba(42, 42, 42, 0.5)),
    repeating-linear-gradient(90deg, #2a2a2a 0px, #3a3a3a 2px, #2a2a2a 4px),
    linear-gradient(180deg, #4a4a4a 0%, #2a2a2a 100%);
}

.portfolio-placeholder.demolition-2::before {
  background: 
    linear-gradient(45deg, rgba(255, 107, 26, 0.1), transparent),
    repeating-linear-gradient(0deg, #1a1a1a 0px, #2a2a2a 10px, #1a1a1a 20px),
    radial-gradient(circle at 30% 50%, #3a3a3a, #1a1a1a);
}

.portfolio-placeholder.demolition-3::before {
  background: 
    linear-gradient(to bottom, rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.6)),
    repeating-linear-gradient(45deg, #2a2a2a 0px, #3a3a3a 15px, #2a2a2a 30px),
    linear-gradient(135deg, #4a4a4a, #252525);
}

.portfolio-placeholder.demolition-4::before {
  background: 
    radial-gradient(circle at 70% 30%, rgba(255, 214, 10, 0.15), transparent),
    repeating-linear-gradient(90deg, #252525 0px, #353535 8px, #252525 16px),
    linear-gradient(180deg, #3a3a3a, #1a1a1a);
}

.portfolio-placeholder.demolition-5::before {
  background: 
    linear-gradient(135deg, rgba(0, 0, 0, 0.5), rgba(42, 42, 42, 0.3)),
    repeating-linear-gradient(0deg, #2a2a2a 0px, #1a1a1a 5px, #2a2a2a 10px),
    radial-gradient(ellipse at 50% 80%, #4a4a4a, #1a1a1a);
}

.portfolio-placeholder.demolition-6::before {
  background: 
    linear-gradient(to top, rgba(255, 107, 26, 0.1), transparent),
    repeating-linear-gradient(135deg, #252525 0px, #353535 12px, #252525 24px),
    linear-gradient(90deg, #3a3a3a, #2a2a2a, #3a3a3a);
}

.portfolio-icon {
  position: relative;
  z-index: 1;
  font-size: 64px;
  filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.8));
}

.portfolio-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 24px;
  background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
}

.portfolio-overlay h3 {
  font-size: 18px;
  margin-bottom: 4px;
}

.portfolio-overlay p {
  font-size: 14px;
  color: var(--text-gray);
}

/* Reviews */
.reviews-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 32px;
}

.review-card {
  background: var(--bg-gray);
  border: 1px solid var(--border-gray);
  border-radius: 16px;
  padding: 32px;
}

.review-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 16px;
}

.review-avatar {
  width: 56px;
  height: 56px;
  background: linear-gradient(135deg, var(--accent-yellow), var(--accent-orange));
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Montserrat', sans-serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--bg-dark);
}

.review-info h4 {
  font-size: 18px;
  margin-bottom: 4px;
}

.review-stars {
  color: var(--accent-yellow);
  font-size: 14px;
}

.review-card p {
  color: var(--text-gray);
  line-height: 1.6;
}

/* FAQ */
.faq-list {
  max-width: 900px;
  margin: 0 auto;
}

.faq-item {
  background: var(--bg-gray);
  border: 1px solid var(--border-gray);
  border-radius: 12px;
  margin-bottom: 16px;
  overflow: hidden;
}

.faq-question {
  width: 100%;
  padding: 24px;
  background: transparent;
  border: none;
  color: var(--text-white);
  font-family: 'Montserrat', sans-serif;
  font-size: 18px;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: color 0.2s;
}

.faq-question:hover {
  color: var(--accent-yellow);
}

.faq-icon {
  font-size: 24px;
  transition: transform 0.3s ease;
}

.faq-item.open .faq-icon {
  transform: rotate(45deg);
}

.faq-answer {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
}

.faq-item.open .faq-answer {
  max-height: 500px;
}

.faq-answer-content {
  padding: 0 24px 24px;
  color: var(--text-gray);
  line-height: 1.6;
}

/* CTA Section */
.cta-section {
  background: linear-gradient(135deg, var(--accent-yellow), var(--accent-orange));
  border-radius: 24px;
  padding: 80px;
  text-align: center;
  margin: 100px 0;
}

.cta-section h2 {
  font-size: 48px;
  color: var(--bg-dark);
  margin-bottom: 16px;
}

.cta-section p {
  font-size: 20px;
  color: rgba(10, 10, 10, 0.8);
  margin-bottom: 32px;
}

.cta-section .btn {
  background: var(--bg-dark);
  color: var(--text-white);
}

.cta-section .btn:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
}

/* Footer */
footer {
  background: var(--bg-gray);
  border-top: 1px solid var(--border-gray);
  padding: 60px 0 30px;
}

.footer-content {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr;
  gap: 48px;
  margin-bottom: 48px;
}

.footer-brand h3 {
  font-size: 28px;
  margin-bottom: 16px;
  background: linear-gradient(135deg, var(--accent-yellow), var(--accent-orange));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.footer-brand p {
  color: var(--text-gray);
  margin-bottom: 24px;
}

.footer-contact {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.footer-contact a {
  color: var(--text-white);
  text-decoration: none;
  font-weight: 500;
  transition: color 0.2s;
}

.footer-contact a:hover {
  color: var(--accent-yellow);
}

.footer-section h4 {
  font-size: 16px;
  margin-bottom: 16px;
  color: var(--accent-yellow);
}

.footer-links {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.footer-links a {
  color: var(--text-gray);
  text-decoration: none;
  font-size: 14px;
  transition: color 0.2s;
}

.footer-links a:hover {
  color: var(--text-white);
}

.footer-bottom {
  padding-top: 30px;
  border-top: 1px solid var(--border-gray);
  text-align: center;
  color: var(--text-gray);
  font-size: 14px;
}

/* Sticky CTA Button */
.sticky-cta {
  position: fixed;
  bottom: 32px;
  right: 32px;
  z-index: 999;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.3s ease;
}

.sticky-cta.visible {
  opacity: 1;
  transform: translateY(0);
}

.sticky-cta .btn {
  box-shadow: 0 8px 32px rgba(255, 214, 10, 0.4);
  padding: 16px 32px;
  font-size: 16px;
}

/* Responsive */
@media (max-width: 968px) {
  .hero-content {
    grid-template-columns: 1fr;
    gap: 48px;
  }
  
  .hero-text h1 {
    font-size: 48px;
  }
  
  .services-grid {
    grid-template-columns: 1fr;
  }
  
  .steps-timeline {
    grid-template-columns: 1fr;
    gap: 48px;
  }
  
  .steps-timeline::before {
    display: none;
  }
  
  .portfolio-grid {
    grid-template-columns: 1fr;
  }
  
  .reviews-grid {
    grid-template-columns: 1fr;
  }
  
  .footer-content {
    grid-template-columns: 1fr;
  }
  
  nav {
    display: none;
  }
}
</style>
</head>

</header>

<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "colorScheme": "dark-yellow",
  "heroStyle": "split",
  "showPricing": true,
  "animateNumbers": true
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  
  // Calculator state
  const [calcType, setCalcType] = useState('apartment');
  const [calcArea, setCalcArea] = useState('');
  const [calcServices, setCalcServices] = useState([]);
  const [calcPrice, setCalcPrice] = useState(0);
  
  // Form state
  const [formName, setFormName] = useState('');
  const [formPhone, setFormPhone] = useState('');
  const [formSubmitted, setFormSubmitted] = useState(false);
  
  // FAQ state
  const [openFaq, setOpenFaq] = useState(null);
  
  // Scroll effects
  useEffect(() => {
    const handleScroll = () => {
      const header = document.getElementById('header');
      const stickyCta = document.getElementById('stickyCta');
      
      if (window.scrollY > 100) {
        header?.classList.add('scrolled');
        stickyCta?.classList.add('visible');
      } else {
        header?.classList.remove('scrolled');
